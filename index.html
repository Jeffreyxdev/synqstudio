<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO Title -->
  <title>Synq Studio | Tech Brand Web Design Agency for Startups & Modern Companies</title>

  <!-- Meta Description -->
  <meta
    name="description"
    content="Synq Studio is a modern tech brand web design agency helping startups and digital companies build high-converting websites, strong visual identity, and premium user experiences."
  />

  <!-- SEO Keywords (light use, still helpful for context) -->
  <meta
    name="keywords"
    content="tech web design agency, web design agency for startups, tech brand design studio, UI UX design agency, modern web design studio, startup web designers, digital product design"
  />

  <!-- Author / Brand -->
  <meta name="author" content="Synq Studio" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:title" content="Synq Studio | Tech Brand Web Design Agency" />
  <meta
    property="og:description"
    content="We design premium websites and digital identities for tech brands, startups, and modern companies."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://synqstudio.xyz" />
  <meta property="og:image" content="" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Synq Studio | Tech Web Design Agency" />
  <meta
    name="twitter:description"
    content="A modern web design agency crafting digital experiences for tech startups and brands."
  />
  <meta name="twitter:image" content="/og-imavercel.appge.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..800;1,300..800&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=VT323&display=swap"
    rel="stylesheet"
  />

  <!-- Indexing Control -->
  <meta name="robots" content="index, follow" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
