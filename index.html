<!doctype html>
<html lang="en">
<head>
  <!-- existing minimal tags -->
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synq Studio | Tech Brand Web Design Agency for Startups & Modern Companies</title>

  <!-- improved SEO / social metadata -->
  <meta name="description" content="Synq Studio is a modern tech brand web design agency helping startups and digital companies build high-converting websites, strong visual identity, and premium user experiences." />
  <link rel="canonical" href="https://synqstudio.xyz/" />

  <!-- Icons (favicon, apple, mask) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Open Graph -->
  <meta property="og:title" content="Synq Studio - Web Design Agency for startups, SAAS & Modern Companies" />
  <meta property="og:description" content="We design premium websites and digital identities for technology startups, YC-backed companies, and modern high-growth brands." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://synqstudio.xyz/" />
  <meta property="og:image" content="https://raw.githubusercontent.com/Jeffreyxdev/synqstudio/refs/heads/main/public/ogimg.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Synq Studio | Tech Web Design Agency for Startups, SAAS & Modern Companies" />
  <meta name="twitter:description" content="A modern web design agency crafting digital experiences for tech startups and brands." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/Jeffreyxdev/synqstudio/refs/heads/main/public/ogimg.png" />

  <!-- Structured Data: Organization (helps Google pick a logo) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Synq Studio",
    "url": "https://synqstudio.xyz",
    "logo": "https://synqstudio.xyz/logo.png",
    "sameAs": [
      "https://twitter.com/synqstudios",
      
    ]
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..800;1,300..800&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=VT323&display=swap" rel="stylesheet" />

  <meta name="robots" content="index, follow" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
